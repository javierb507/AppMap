name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Smoke test server
        shell: bash
        run: |
          node server.js &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:10000/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:10000/api/apps | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('apps:',j.count);if(!j.apps.some(a=>a.port===10000))process.exit(1)})"
